<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HexCiv: Restore the Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: the map fills the screen. Resources run down the left, actions down the right, the season sits top centre with
   notices under it, the event feed at the bottom. There is no goal text: the map shows what is happening.
   Menu, tech tree and the end of a run are full-screen overlays; buying an upgrade is a popup.
   Panels are drawn like the tiles: an ink outline, a light bevel on the upper-left and a shade on the lower-right. */
:root {
  color-scheme: dark;
  --ink: #141d26; --deep: #1a3445; --deep2: #234559; --deep0: #0f2230; --sky: #a9d5f0;
  --wood: #77513c; --wood-hi: #b57f52; --wood-lo: #3f2b31;
  --leaf: #2f7d46; --leaf-hi: #9bcb3e; --leaf-lo: #23584c;
  --rose: #c0473f; --rose-hi: #e8587d; --rose-lo: #6e2630;
  --gold: #e6c35a; --cream: #f4f6ea; --muted: #a3b5c4; --lime: #c9e05a;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --gutter-l: max(12px, env(safe-area-inset-left, 0px)); --gutter-r: max(12px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--cream); font-family: var(--body); font-size: 14px; }
body { padding-left: 0; padding-right: 0; }
canvas#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
img.ic { image-rendering: pixelated; image-rendering: crisp-edges; width: 24px; height: 24px; display: block; flex: none; }
.panel { background: var(--deep); border: 2px solid var(--ink); box-shadow: inset 2px 2px 0 var(--deep2), inset -2px -2px 0 var(--deep0), 0 3px 0 rgba(20, 29, 38, .45); }
.btn { font-family: var(--display); font-size: 16px; color: var(--cream); background: var(--wood); border: 2px solid var(--ink); box-shadow: inset 2px 2px 0 var(--wood-hi), inset -2px -2px 0 var(--wood-lo), 0 3px 0 rgba(20, 29, 38, .45); padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 2px 2px 0 var(--wood-lo), inset -2px -2px 0 var(--wood-hi); }
.btn.go { background: var(--leaf); box-shadow: inset 2px 2px 0 var(--leaf-hi), inset -2px -2px 0 var(--leaf-lo), 0 3px 0 rgba(20, 29, 38, .45); }
.btn.no { background: var(--rose); box-shadow: inset 2px 2px 0 var(--rose-hi), inset -2px -2px 0 var(--rose-lo), 0 3px 0 rgba(20, 29, 38, .45); }
.btn:disabled { filter: grayscale(.8) brightness(.75); cursor: not-allowed; }
.btn:focus-visible, .node:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.btn .cost { color: var(--gold); }

/* ---- HUD ---- */
.hud { position: fixed; inset: 0; pointer-events: none; padding: 12px var(--gutter-r) 12px var(--gutter-l); }
.hud > * { pointer-events: auto; }
.res { position: absolute; left: var(--gutter-l); top: 12px; display: grid; gap: 6px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; min-width: 96px; }
.chip b { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.chip small { display: block; font-family: var(--display); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
.chip.warn b { color: var(--rose-hi); }
.top { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: grid; gap: 6px; width: min(340px, calc(100% - 300px)); }
.season { padding: 6px 10px; display: grid; gap: 4px; }
.season .row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); }
.season b { font-size: 18px; font-weight: 600; }
.season span { color: var(--muted); font-size: 13px; }
.bar { height: 6px; background: var(--deep0); border: 1px solid var(--ink); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; }
.notes { position: absolute; left: 50%; top: 132px; transform: translateX(-50%); width: min(340px, calc(100% - 300px)); display: grid; gap: 6px; pointer-events: none; }
.notice { padding: 6px 10px; font-size: 13.5px; line-height: 1.35; }
.notice.bad { background: #3a1d26; box-shadow: inset 2px 2px 0 var(--rose-lo), inset -2px -2px 0 #22121a, 0 3px 0 rgba(20, 29, 38, .45); color: #ffd9de; }
.side { position: absolute; right: var(--gutter-r); top: 12px; display: grid; gap: 8px; justify-items: end; }
.side .btn { width: 100%; justify-content: flex-start; }
.speed { display: flex; gap: 4px; }
.speed .btn { padding: 4px 8px; font-size: 14px; width: auto; }
.speed .btn[aria-pressed="true"] { background: var(--leaf); box-shadow: inset 2px 2px 0 var(--leaf-hi), inset -2px -2px 0 var(--leaf-lo); }
.bottom { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); display: grid; gap: 6px; }
.tile { position: absolute; left: var(--gutter-l); top: 280px; width: 300px; box-sizing: border-box; padding: 10px 12px; display: grid; gap: 8px; }
.tile .th { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile .th b { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--lime); }
.tile .x { font: inherit; color: var(--cream); background: none; border: 0; font-size: 16px; padding: 2px 6px; cursor: pointer; }
.tile p { margin: 0; line-height: 1.4; }
.tile .note { color: var(--muted); font-size: 13px; }
.tile .note:empty { display: none; }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { width: 36px; height: 36px; display: grid; place-items: center; background: var(--deep0); border: 2px solid var(--ink); box-shadow: inset 2px 2px 0 rgba(0,0,0,.35); }
.slot.on { background: var(--deep2); box-shadow: inset 2px 2px 0 #2f5c74, inset -2px -2px 0 var(--deep0); }
.slot img { width: 24px; height: 24px; image-rendering: pixelated; }
.slot:not(.on) img { opacity: .25; }
.tacts { display: flex; gap: 8px; flex-wrap: wrap; }
.tacts .btn { flex: 1; justify-content: center; }
.tile > .btn { justify-content: center; }
#tDock { flex-direction: column; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12.5px; text-shadow: 0 1px 0 var(--ink); }
.feed li { background: rgba(20, 29, 38, .6); padding: 2px 8px; justify-self: start; }
.feed li:nth-child(2) { opacity: .75; } .feed li:nth-child(3) { opacity: .5; }
.tip { position: fixed; pointer-events: none; padding: 6px 9px; font-size: 13px; line-height: 1.35; min-width: 140px; display: none; z-index: 5; }
.tip b { font-family: var(--display); font-weight: 600; font-size: 16px; display: block; color: var(--lime); }
.tip span { color: var(--muted); display: block; }

/* ---- overlays ---- */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px var(--gutter-r) 16px var(--gutter-l); background: rgba(15, 34, 48, .72); overflow-y: auto; }
.menu { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 28px 28px 24px; width: min(360px, 100%); box-sizing: border-box; }
.menu h1 { font-family: var(--display); font-weight: 700; font-size: 56px; line-height: 1; margin: 0; color: var(--lime); text-shadow: 3px 3px 0 var(--ink); }
.menu p { margin: 0 0 8px; color: var(--muted); }
.menu .btn { width: 100%; justify-content: center; font-size: 20px; padding: 12px; }
.menu small { color: var(--muted); }
.tree { width: min(560px, 100%); box-sizing: border-box; padding: 14px; display: grid; gap: 12px; }
.tree header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tree h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; }
.tree .gold { font-family: var(--display); font-size: 18px; color: var(--gold); display: flex; align-items: center; gap: 6px; }
.graph { position: relative; aspect-ratio: 4 / 4; max-width: 100%; background: var(--deep0); border: 2px solid var(--ink); }
.graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 18%; aspect-ratio: 1; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--deep2); border: 2px solid var(--ink); box-shadow: inset 2px 2px 0 #2f5c74, inset -2px -2px 0 var(--deep0), 0 3px 0 rgba(0, 0, 0, .4); }
.node img { width: 60%; height: 60%; image-rendering: pixelated; }
.node span { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--display); font-size: 13px; color: var(--cream); text-shadow: 0 1px 0 var(--ink); }
.node.owned { background: var(--leaf); box-shadow: inset 2px 2px 0 var(--leaf-hi), inset -2px -2px 0 var(--leaf-lo), 0 3px 0 rgba(0, 0, 0, .4); }
.node.ready { animation: pulse 1.4s steps(2) infinite; }
.node.ready::after { content: ""; position: absolute; top: -6px; right: -6px; width: 10px; height: 10px; background: var(--gold); border: 2px solid var(--ink); }
.node.locked img, .node.soon img { filter: grayscale(1) brightness(.6); }
.node.soon { border-style: dashed; }
.node.hidden { display: none; }
.tree .more { margin: 4px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
.goal { display: grid; gap: 1px; text-align: left; padding: 6px 10px; cursor: pointer; font: inherit; color: var(--cream); border: 0; box-shadow: inset 2px 2px 0 #f4e98a, inset -2px -2px 0 #b5932f, 0 3px 0 rgba(20, 29, 38, .45); }
.goal small { font-family: var(--display); font-size: 11px; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }
.goal b { font-family: var(--display); font-weight: 600; font-size: 15px; }
.goal:hover b { color: var(--gold); }
.whisper { color: var(--gold); font-size: 13.5px; border-left: 3px solid var(--gold); padding-left: 8px; }
.fixes { display: grid; gap: 8px; }
.fix { display: grid; gap: 4px; font-size: 13px; }
.fix p { color: var(--cream); }
.pbar { position: relative; height: 16px; background: var(--deep0); border: 1px solid var(--ink); }
.pbar i { position: absolute; inset: 0 auto 0 0; background: var(--leaf); }
.pbar span { position: relative; display: block; font-size: 11.5px; line-height: 16px; padding-left: 6px; color: var(--cream); text-shadow: 0 1px 0 var(--ink); }
.fixbtn { justify-self: start; font-size: 13px; }
.fixbtn.off { opacity: .7; }
@keyframes pulse { 50% { box-shadow: inset 2px 2px 0 var(--gold), inset -2px -2px 0 var(--deep0), 0 3px 0 rgba(0, 0, 0, .4); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin: 0; }
.pop { width: min(320px, 100%); box-sizing: border-box; padding: 20px 18px 16px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.pop .big { width: 72px; height: 72px; padding: 8px; background: var(--deep2); border: 2px solid var(--ink); box-shadow: inset 2px 2px 0 #2f5c74, inset -2px -2px 0 var(--deep0); }
.pop .big img { width: 72px; height: 72px; image-rendering: pixelated; }
.pop h3 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; }
.pop p { margin: 0; line-height: 1.45; }
.pop .price { font-family: var(--display); font-size: 20px; color: var(--gold); display: flex; align-items: center; gap: 6px; }
.pop .need { color: var(--rose-hi); font-size: 13px; }
.pop .acts { display: flex; gap: 10px; width: 100%; }
.pop .acts .btn { flex: 1; justify-content: center; }
.end { width: min(400px, 100%); box-sizing: border-box; padding: 26px 24px 22px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.end h2 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 0; color: var(--muted); }
.end p { margin: 0; line-height: 1.45; }
.end .why { font-size: 16px; color: #ffd9de; }
.end .btn { width: 100%; justify-content: center; font-size: 18px; }


/* ---- v3: ribbon, crews, lenses, tile values, plans and steps, dock ---- */
.ribbon { position: relative; }
#ribbon { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.seg { display: flex; justify-content: center; gap: 2px; padding: 2px 0; background: var(--deep0); border: 1px solid var(--ink); opacity: .55; }
.seg.on { opacity: 1; background: var(--deep2); }
.seg img { width: 12px; height: 12px; image-rendering: pixelated; }
#nowMark { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--gold); box-shadow: 0 0 0 1px var(--ink); }
.btn.mini { font-size: 13px; padding: 2px 7px; }
.lenses { display: flex; gap: 4px; }
.lenses .btn { padding: 4px 8px; font-size: 13px; width: auto; }
.lenses .btn[aria-pressed="true"] { background: var(--leaf); box-shadow: inset 2px 2px 0 var(--leaf-hi), inset -2px -2px 0 var(--leaf-lo); }
.crews { display: grid; gap: 6px; width: 250px; }
.crew { padding: 6px 8px; display: grid; gap: 3px; border-left: 4px solid var(--hue, var(--muted)); }
.crew .ch { display: flex; align-items: center; gap: 6px; }
.crew .ch img.ic { width: 18px; height: 18px; }
.crew .ch b { font-family: var(--display); font-weight: 600; font-size: 15px; flex: 1; }
.crew .ch .n { font-family: var(--display); font-size: 15px; color: var(--gold); min-width: 14px; text-align: right; }
.crew p { margin: 0; font-size: 12.5px; line-height: 1.3; }
.crew .who span { white-space: nowrap; }
.crew .who .hurt { color: var(--rose-hi); }
.crew .who .gone { color: var(--muted); text-decoration: line-through; }
.crew .who .empty { color: var(--muted); }
.crew .doing { color: var(--muted); }
.crew .doing:empty { display: none; }
.crew .cut { justify-self: start; }
.side .crews .btn { width: auto; }
.vals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.val { background: var(--deep0); border: 2px solid var(--ink); padding: 3px 6px; display: grid; }
.val small { font-family: var(--display); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.val b { font-family: var(--display); font-weight: 600; font-size: 15px; }
.val i { font-style: normal; color: var(--lime); letter-spacing: 1px; font-size: 11px; }
.plans { display: flex; gap: 6px; flex-wrap: wrap; }
.plans .btn { padding: 5px 9px; font-size: 14px; }
.plans .btn.plan.on { background: var(--pc); box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.35); }
.plans .prio { color: var(--gold); letter-spacing: 2px; }
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 12.5px; }
.chip-step { padding: 1px 6px; border: 1px solid var(--ink); background: var(--deep0); color: var(--muted); }
.chip-step.done { background: var(--leaf-lo); color: var(--leaf-hi); text-decoration: line-through; }
.chip-step.now { background: var(--deep2); color: var(--cream); border-color: var(--gold); }
.steps .arr { color: var(--muted); }
.dock { display: grid; gap: 6px; }
.dock p { margin: 0; }
.keep { display: flex; align-items: center; gap: 6px; }
.keep span { flex: 1; }
.keep b { font-family: var(--display); min-width: 26px; text-align: center; }
#sellSurplus { justify-content: center; }
.buyrow { display: flex; gap: 6px; }
.buyrow .btn { flex: 1; justify-content: center; padding: 6px 8px; font-size: 14px; }
.graph { aspect-ratio: 6 / 5; }
.node { width: 9.5%; aspect-ratio: 6 / 5; }
.node span { font-size: 11px; bottom: -18px; }
.branch { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--display); font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.tree { width: min(760px, 100%); }
.lock { font: inherit; font-family: var(--display); font-size: 13px; color: var(--ink); background: var(--gold); border: 2px solid var(--ink); padding: 2px 8px; margin-top: 4px; cursor: pointer; display: inline-block; box-shadow: inset -2px -2px 0 #b5932f; }
.lock:hover { background: #f4e98a; }
button.chip-step.locked { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--gold); border-color: var(--ink); cursor: pointer; }
.node.goal { outline: 3px solid var(--gold); outline-offset: 3px; }
.node.goal span { color: var(--gold); }
/* ---- v4: the action ring and camps ---- */
.hud:has(.ring:not([hidden])) .bottom { display: none; }
.coord { font-family: inherit; font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.paused { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; padding: 10px 16px; font: inherit; font-weight: 700; color: #f4f6ea; background: rgba(63, 43, 49, .88); border: 2px solid #e6c35a; border-radius: 10px; cursor: pointer; }
.ring { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 4; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 24px); }
.rv { display: grid; justify-items: center; gap: 2px; min-width: 64px; max-width: 110px; padding: 5px 7px 4px; cursor: pointer;
  font-family: var(--display); font-size: 12.5px; line-height: 1.1; color: var(--cream); text-align: center;
  background: var(--wood); border: 2px solid var(--ink); box-shadow: inset 2px 2px 0 var(--wood-hi), inset -2px -2px 0 var(--wood-lo), 0 3px 0 rgba(20, 29, 38, .45); }
.rv img { width: 24px; height: 24px; image-rendering: pixelated; }
.rv em { font-style: normal; color: var(--gold); display: block; }
.rv.on { background: var(--leaf); box-shadow: inset 2px 2px 0 var(--leaf-hi), inset -2px -2px 0 var(--leaf-lo), 0 3px 0 rgba(20, 29, 38, .45); }
.rv[aria-disabled="true"] { filter: grayscale(.7) brightness(.7); cursor: not-allowed; }
.rv:not([aria-disabled="true"]):hover { outline: 2px solid var(--lime); }
.campinfo { display: grid; gap: 4px; font-size: 13px; }
.campinfo p { margin: 0; line-height: 1.35; }
.campinfo .beds { color: var(--lime); letter-spacing: 1px; }
.campinfo .beds b { color: var(--cream); letter-spacing: 0; font-weight: 600; }
.campinfo .who .hurt { color: var(--rose-hi); }
.campinfo .who .gone { color: var(--muted); text-decoration: line-through; }
.campinfo .who .empty, .campinfo .doing, .campinfo .next { color: var(--muted); }
#needBtn.go { animation: pulse 1.4s steps(2) infinite; }
@media (max-width: 720px) {
  .side { top: 84px; bottom: auto; left: var(--gutter-l); right: var(--gutter-r); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; grid-auto-flow: unset; }
  .side .btn { width: auto; }
  .lenses { position: fixed; left: var(--gutter-l); bottom: 84px; }
  .ring { bottom: 84px; }
  .hud:has(.ring:not([hidden])) .lenses { display: none; }
  .tile { max-height: 150px; overflow-y: auto; padding: 8px 10px; gap: 6px; }
  .tile .th b { font-size: 17px; }
  .rv { min-width: 56px; font-size: 11.5px; padding: 4px 5px 3px; }
  .tile { top: 130px; }
  .notes { bottom: 130px; }
  .node span { font-size: 9px; }
  .branch { font-size: 8px; }
}
@media (max-width: 720px) {
  .res { grid-template-columns: repeat(3, auto); gap: 4px; }
  .chip { min-width: 0; padding: 3px 8px 3px 4px; }
  .chip small { display: none; }
  .chip b { font-size: 16px; }
  img.ic { width: 18px; height: 18px; }
  .top { top: auto; bottom: 12px; width: calc(100% - var(--gutter-l) - var(--gutter-r)); left: var(--gutter-l); transform: none; }
  .side .btn { padding: 6px 8px; }
  .side .btn span.lbl { display: none; }
  .tile { top: 130px; right: var(--gutter-r); width: auto; }
  .feed { display: none; }
  .notes { top: auto; bottom: 152px; left: var(--gutter-l); right: var(--gutter-r); width: auto; transform: none; }
}
@media (prefers-reduced-motion: reduce) { .node.ready { animation: none; } }
</style>
</head>
<body>
<canvas id="map" aria-label="The ruined Verdant Reach. Tap a hex for its actions; tap it again to lend a hand."></canvas>

<div class="hud" id="hud">
  <div class="res" id="res"></div>
  <div class="top">
    <div class="panel season"><div class="row"><b id="season">Spring</b><span id="year">Year 1</span></div><div class="ribbon" aria-hidden="true"><div id="ribbon"></div><i id="nowMark"></i></div></div>
    <button class="panel goal" id="goal" hidden aria-label="Show the chapter's goal on the map"></button>
  </div>
  <div class="notes" id="notes" aria-live="polite"></div>
  <div class="side">
    <button class="btn" id="menuBtn" aria-label="Menu">◀ <span class="lbl">Menu</span></button>
    <button class="btn go" id="treeBtn" aria-label="Tech tree"><img class="ic" alt="" data-ic="tree"><span class="lbl">Tech</span></button>
    <button class="btn" id="needBtn" aria-label="Go to what needs you"><img class="ic" alt="" data-ic="pop"><span class="lbl">All quiet</span></button>
    <div class="speed" role="group" aria-label="Game speed">
      <button class="btn" data-speed="0" aria-label="Pause">❚❚</button>
      <button class="btn" data-speed="1" aria-pressed="true">1×</button>
      <button class="btn" data-speed="2">2×</button>
      <button class="btn" data-speed="4">4×</button>
    </div>
    <div class="lenses" role="group" aria-label="Map lenses">
      <button class="btn" data-lens="soil" aria-pressed="false">Soil</button>
      <button class="btn" data-lens="food" aria-pressed="false">Food</button>
      <button class="btn" data-lens="water" aria-pressed="false">Water</button>
    </div>
    <button class="btn" id="sendBtn" hidden aria-label="Send this game to Claude">🐞 <span class="lbl">Send to Claude</span></button>
  </div>
  <div class="panel tile" id="tilePanel" hidden>
      <div class="th"><b id="tName"></b><button class="x" id="tClose" aria-label="Close">✕</button></div>
      <p id="tInfo"></p>
      <div class="vals" id="tVals"></div>
      <div class="campinfo" id="tCamp" hidden></div>
      <p class="whisper" id="tWhisper" hidden></p>
      <div class="steps" id="tSteps"></div>
      <div class="fixes" id="tFix" hidden></div>
      <div class="dock" id="tDock" hidden>
        <p id="dockBoat"></p>
        <div class="keep"><span>Keep logs</span><button class="btn mini" data-keep="logs:-5">−</button><b id="keepLogs"></b><button class="btn mini" data-keep="logs:5">+</button></div>
        <div class="keep"><span>Keep food</span><button class="btn mini" data-keep="food:-5">−</button><b id="keepFood"></b><button class="btn mini" data-keep="food:5">+</button></div>
        <button class="btn go" id="sellSurplus"></button>
        <div class="buyrow"><button class="btn" id="buyLogs"></button><button class="btn" id="buyFood"></button><button class="btn" id="buySeed"></button></div>
        <p class="note" id="dockStock"></p>
      </div>
      <p class="note" id="tNote"></p>
    </div>
  <div class="ring" id="ring" hidden></div>
  <button class="paused" id="paused" hidden>❚❚ Paused. Tap here or press space to play.</button>
  <div class="bottom">
    <ul class="feed" id="log"></ul>
  </div>
</div>
<div class="panel tip" id="tip"></div>

<div class="overlay" id="menu">
  <div class="panel menu">
    <h1>HexCiv</h1>
    <p>Restore the Valley</p>
    <button class="btn go" id="resume">Resume</button>
    <button class="btn" id="newGame">New game</button>
    <small id="saveNote"></small>
  </div>
</div>

<div class="overlay" id="treeView" hidden>
  <div class="panel tree">
    <header><button class="btn" id="treeBack">◀ Back</button><h2>Tech tree</h2><span class="gold"><img class="ic" alt="" data-ic="coin"><span id="treeGold">0</span></span></header>
    <div class="graph" id="graph"><svg id="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    <p class="more" id="treeMore"></p>
    <p class="legend"><span>Green: owned</span><span>Gold dot: you can buy it</span><span>Grey: needs the upgrade above</span><span>Dashed: coming later</span><span>Gold outline: the way to a locked step</span></p>
  </div>
</div>

<div class="overlay" id="popView" hidden>
  <div class="panel pop" role="dialog" aria-modal="true" aria-labelledby="popName">
    <div class="big"><img id="popIcon" alt=""></div>
    <h3 id="popName"></h3>
    <p id="popText"></p>
    <div class="price" id="popPrice"></div>
    <p class="need" id="popNeed"></p>
    <div class="acts"><button class="btn no" id="popNo">Cancel</button><button class="btn go" id="popYes">Buy</button></div>
  </div>
</div>

<div class="overlay" id="endView" hidden>
  <div class="panel end" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <h2 id="endTitle">The valley is quiet</h2>
    <p class="why" id="endText"></p>
    <p id="endStats"></p>
    <button class="btn go" id="again">Start again</button>
  </div>
</div>

<script src="src/tiles.js"></script>
<script src="src/icons.js"></script>
<script src="src/game.js"></script>
</body>
</html>
